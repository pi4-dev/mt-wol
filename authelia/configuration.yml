# Minimal Authelia 4.38 configuration - adjust to your environment.
# Set secrets via AUTHELIA_* environment variables or secret files.
server:
  address: tcp://:9091
log:
  level: info
authentication_backend:
  file:
    path: /config/users_database.yml
access_control:
  default_policy: deny
  rules:
    - domain: wol.example.com   # must match APP_DOMAIN
      policy: one_factor
session:
  cookies:
    - domain: example.com       # shared parent domain
      authelia_url: https://auth.example.com
      default_redirection_url: https://wol.example.com
storage:
  local:
    path: /config/db.sqlite3
notifier:
  filesystem:
    filename: /config/notification.txt
